<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 44" width="22" height="40" role="img" aria-label="Gem">
  <!-- Single flipped petal — amber. Slim almond body with vertical
       ribs and a small amber cap at the top. Matches the design
       board "flipped petal — 6 colour options" (teal + amber row).
       Stroke is a warm umber; the body fill is very light so the
       ribs read through cleanly. -->

  <!-- Top cap / calyx: a short rounded half-ellipse sitting above
       the petal tip. -->
  <path
    d="M9 6
       C 9 3, 15 3, 15 6
       L 14 8
       L 10 8
       Z"
    fill="#D89035"
    stroke="#8C4A12"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- Petal body: almond shape, slightly tapered at top, gently
       rounded at the bottom. -->
  <path
    d="M12 8
       C 5 14, 3 26, 4 34
       C 5 39, 9 41, 12 41
       C 15 41, 19 39, 20 34
       C 21 26, 19 14, 12 8 Z"
    fill="#FFF7E8"
    stroke="#C97E2A"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Vertical ribs running the length of the petal. Three lines:
       a central rib plus two flanking ones that follow the curve of
       the petal so they don't look like stripes pasted on a flat
       shape. -->
  <path d="M12 11 L 12 40"
        fill="none"
        stroke="#C97E2A"
        stroke-width="1"
        stroke-linecap="round" />
  <path d="M8.5 14
           C 6.5 22, 6.5 32, 8.5 39"
        fill="none"
        stroke="#C97E2A"
        stroke-width="1"
        stroke-linecap="round" />
  <path d="M15.5 14
           C 17.5 22, 17.5 32, 15.5 39"
        fill="none"
        stroke="#C97E2A"
        stroke-width="1"
        stroke-linecap="round" />
</svg>
