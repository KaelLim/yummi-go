<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 44" width="22" height="24" role="img" aria-label="Gem">
  <!-- Amber flipped flower — five-petal lotus rotated so the pointed
       tip sits at the top (flipped). Each petal is an outlined almond
       in warm amber; outer petals sit slightly lower, the centre
       petal points straight up. Stroke is a deep umber to echo the
       project's other outlined glyphs. -->

  <!-- Back / side petals (drawn first so the centre petal overlaps). -->
  <g stroke="#8C4A12" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far-left petal -->
    <path d="M20 38
             C 10 32, 4 22, 8 12
             C 14 14, 19 22, 20 30 Z"
          fill="#E0A040" />
    <!-- Mid-left petal -->
    <path d="M20 38
             C 13 30, 11 18, 14 6
             C 18 10, 20 20, 20 30 Z"
          fill="#EAB055" />
    <!-- Centre petal (points straight up, slightly larger) -->
    <path d="M20 38
             C 14 30, 14 14, 20 2
             C 26 14, 26 30, 20 38 Z"
          fill="#F2C26B" />
    <!-- Mid-right petal -->
    <path d="M20 38
             C 27 30, 29 18, 26 6
             C 22 10, 20 20, 20 30 Z"
          fill="#EAB055" />
    <!-- Far-right petal -->
    <path d="M20 38
             C 30 32, 36 22, 32 12
             C 26 14, 21 22, 20 30 Z"
          fill="#E0A040" />
  </g>

  <!-- Base — the rounded calyx the petals bloom out of. -->
  <ellipse cx="20" cy="38" rx="9" ry="3" fill="#C97E2A" stroke="#8C4A12" stroke-width="2" />
</svg>
